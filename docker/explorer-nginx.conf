server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Same-origin proxy to the full node's JSON-RPC so the browser needs no CORS.
    location /rpc {
        proxy_pass http://fullnode:9000/;
        proxy_set_header Content-Type application/json;
        client_max_body_size 64k;
        limit_except POST { deny all; }
    }
}
