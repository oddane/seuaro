# Seuaro container testnet: 4 validators, 1 public full node, faucet,
# monitoring and a block explorer. Start with scripts/net-up.sh, which runs
# the genesis ceremony first.
name: seuaro

x-node: &node
  image: ${SEUARO_IMAGE:-seuaro/node:local}
  networks: [seuaro]
  restart: unless-stopped
  stop_grace_period: 30s
  environment:
    SUI_PROTOCOL_CONFIG_CHAIN_OVERRIDE: mainnet

x-validator: &validator
  <<: *node
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://127.0.0.1:9184/metrics"]
    interval: 10s
    timeout: 5s
    retries: 30

services:
  # One-shot tool container for ceremony coordination (holds no validator keys).
  ceremony:
    <<: *node
    restart: "no"
    profiles: [tools]
    environment:
      SUI_PROTOCOL_CONFIG_CHAIN_OVERRIDE: mainnet
      SEUARO_EPOCH_MS: ${SEUARO_EPOCH_MS:-30000}
    volumes: [ceremony:/ceremony, users:/users]

  # Client/tool container for tests: test-account keys and checkpoint files.
  client:
    <<: *node
    restart: "no"
    profiles: [tools]
    volumes:
      - ceremony:/ceremony:ro
      - users:/users
      - checkpoints:/opt/sui/checkpoints:ro
      - ../packages:/packages:ro
      - ../scripts:/scripts:ro

  v1:
    <<: *validator
    hostname: v1
    command: ["validator", "v1"]
    volumes: [v1-keys:/opt/sui/key-pairs, v1-db:/opt/sui/db, ceremony:/ceremony]
  v2:
    <<: *validator
    hostname: v2
    command: ["validator", "v2"]
    volumes: [v2-keys:/opt/sui/key-pairs, v2-db:/opt/sui/db, ceremony:/ceremony]
  v3:
    <<: *validator
    hostname: v3
    command: ["validator", "v3"]
    volumes: [v3-keys:/opt/sui/key-pairs, v3-db:/opt/sui/db, ceremony:/ceremony]
  v4:
    <<: *validator
    hostname: v4
    command: ["validator", "v4"]
    volumes: [v4-keys:/opt/sui/key-pairs, v4-db:/opt/sui/db, ceremony:/ceremony]

  fullnode:
    <<: *node
    hostname: fullnode
    command: ["fullnode"]
    volumes:
      - fullnode-db:/opt/sui/db
      - checkpoints:/opt/sui/checkpoints
      - ceremony:/ceremony:ro
    ports: ["127.0.0.1:9000:9000"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9184/metrics"]
      interval: 10s
      timeout: 5s
      retries: 30

  faucet:
    <<: *node
    command: ["faucet"]
    volumes: [users:/users]
    ports: ["127.0.0.1:5003:5003"]
    depends_on: [fullnode]

  prometheus:
    image: prom/prometheus:v3.5.0
    networks: [seuaro]
    restart: unless-stopped
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    networks: [seuaro]
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

  explorer:
    image: nginx:1.29-alpine
    networks: [seuaro]
    restart: unless-stopped
    volumes:
      - ../explorer:/usr/share/nginx/html:ro
      - ./explorer-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:8080:80"]
    depends_on: [fullnode]

networks:
  seuaro:
    name: seuaro

volumes:
  ceremony:
  users:
  checkpoints:
  fullnode-db:
  v1-keys:
  v1-db:
  v2-keys:
  v2-db:
  v3-keys:
  v3-db:
  v4-keys:
  v4-db:
