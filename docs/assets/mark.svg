<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Seuaro mark">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <!-- Three ledger bars, offset to read as an "S": settled, ordered, final. -->
  <rect x="20" y="15" width="30" height="8" rx="4" fill="#ffffff"/>
  <rect x="14" y="28" width="36" height="8" rx="4" fill="#ffffff" fill-opacity="0.88"/>
  <rect x="14" y="41" width="30" height="8" rx="4" fill="#ffffff"/>
  <rect x="14" y="15" width="8" height="21" rx="4" fill="#ffffff"/>
  <rect x="42" y="28" width="8" height="21" rx="4" fill="#ffffff"/>
</svg>
