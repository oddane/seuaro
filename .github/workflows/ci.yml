name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: |
          shellcheck -x -S warning scripts/*.sh tests/*.sh
          for f in scripts/*.sh tests/*.sh; do bash -n "$f"; done
      - name: Python helper
        run: python3 -I -m py_compile scripts/devnet_tool.py
      - name: No secrets or devnet state committed
        run: |
          if git ls-files | grep -E '(^|/)devnet/|keystore|\.key$'; then
            echo "::error::devnet state or key material is tracked"; exit 1
          fi
          if git grep -nE 'suiprivkey1[0-9a-z]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'; then
            echo "::error::private key material found"; exit 1
          fi
      - name: Upstream pin is well-formed
        run: |
          source UPSTREAM.lock
          [[ "$UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SEUARO_PROTOCOL_CHAIN" == "mainnet" ]]

  devnet:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CARGO_INCREMENTAL: "0"
      # CI-only: skip debug info to fit the runner's disk. Source is unchanged.
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null || true
          df -h /

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            clang libclang-dev cmake pkg-config libssl-dev libpq-dev zstd

      - name: Fetch pinned upstream
        run: scripts/fetch-upstream.sh

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/sui
          shared-key: upstream-${{ hashFiles('UPSTREAM.lock') }}
          cache-on-failure: true

      - name: Build (upstream --locked + verifier)
        run: scripts/build.sh

      - name: Move unit tests (seuaro_payments)
        run: |
          # Pre-made empty client config so the CLI never generates (and prints) a key.
          export SUI_CONFIG_DIR="$RUNNER_TEMP/sui-config"
          mkdir -p "$SUI_CONFIG_DIR" && echo '[]' > "$SUI_CONFIG_DIR/sui.keystore"
          printf 'keystore:\n  File: %s/sui.keystore\nexternal_keys: ~\nenvs: []\nactive_env: ~\nactive_address: ~\n' "$SUI_CONFIG_DIR" > "$SUI_CONFIG_DIR/client.yaml"
          bin/sui move test --path packages/seuaro_payments

      - name: Genesis
        run: scripts/devnet-genesis.sh

      - name: Start devnet
        run: scripts/devnet-up.sh

      - name: Phase 1 acceptance tests
        run: tests/phase1.sh

      # First run of the on-chain payment flow; made blocking once it passes.
      - name: Payment contracts on devnet
        continue-on-error: true
        run: tests/payments-devnet.sh

      - name: Stop devnet
        if: always()
        run: scripts/devnet-down.sh

      - name: Collect logs (no keys)
        if: always()
        run: |
          mkdir -p ci-artifacts
          cp -R devnet/logs ci-artifacts/ 2>/dev/null || true
          cp -R devnet/test-work ci-artifacts/ 2>/dev/null || true
          cp -R devnet/payments-work ci-artifacts/ 2>/dev/null || true
          rm -rf ci-artifacts/test-work/foreign
          find ci-artifacts -name '*keystore*' -delete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devnet-logs
          path: ci-artifacts
          retention-days: 14
