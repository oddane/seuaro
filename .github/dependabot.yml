version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: ["type: dependencies", "area: ci"]
    commit-message: { prefix: "ci" }
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly }
    labels: ["type: dependencies", "area: container"]
    commit-message: { prefix: "docker" }
# Rust dependencies are pinned by the upstream lockfile (UPSTREAM.lock) and
# change only when the upstream release is bumped.
